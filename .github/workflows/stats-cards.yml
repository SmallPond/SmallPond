name: Update README cards

on:
  push: # 推送时立即触发
    branches:
      - main
      - master
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write # 允许 workflow 提交并推送 SVG 文件

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.READ_STATS_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.READ_STATS_TOKEN }}

      # pin 卡片已禁用：readme-tools/github-readme-stats 仓库不存在
      # （该 action 已迁移至 stats-organization org，旧示例仓库失效）
      # 如需展示置顶仓库，取消注释并将 username/repo 改为你自己的仓库
      # - name: Generate pin card
      #   uses: readme-tools/github-readme-stats-action@v1
      #   with:
      #     card: pin
      #     options: username=<你的用户名>&repo=<仓库名>
      #     path: profile/pin-<仓库名>.svg
      #     token: ${{ secrets.READ_STATS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
